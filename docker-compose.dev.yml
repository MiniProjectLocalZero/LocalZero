# Development override for docker-compose.yml
# Mounts source code live and runs Maven directly so changes are picked up immediately.
# Usage:
#   docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  app:
    image: eclipse-temurin:21-jdk-alpine
    container_name: localzero-app-dev
    working_dir: /app
    volumes:
      - .:/app
      - /app/target
      - ~/.m2:/root/.m2
    command: >
      sh -c "sed -i 's/\\r$//' mvnw && chmod +x mvnw && ./mvnw spring-boot:run"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/localzero
      DB_USERNAME: localzero
      DB_PASSWORD: localzero
      SPRING_DEVTOOLS_RESTART_ENABLED: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
