<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>LocalZero - Log eco-action</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/styles.css}">
    <link rel="stylesheet" th:href="@{/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/messaging.css}">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="initiative-form-container">
    <h1>Log an eco-action</h1>
    <p class="description-text">What have you done today to save CO2? Write it down below to track your impact!</p>

    <form th:action="@{/actions/log}" th:object="${sustainabilityActionDto}" method="post">

        <div class="form-group">
            <label for="title">Action Title</label>
            <input type="text" id="title" th:field="*{title}" placeholder="e.g., Cycled to work" required />
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" th:field="*{description}" rows="3" placeholder="Tell us more about what you did..."></textarea>
        </div>

        <div class="form-group">
            <label for="category">Category</label>
            <select id="category" th:field="*{category}">
                <option th:each="cat : ${categories}"
                        th:value="${cat}"
                        th:text="${cat.displayName}">Category</option>
            </select>
        </div>

        <button type="submit" class="btn-submit">Save Action</button>
    </form>
    
    <a th:href="@{/}" class="footer-link">← Back to Dashboard</a>
</div>

</body>
</html>
