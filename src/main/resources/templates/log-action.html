<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>LocalZero - Log eco-action</title>
    <link rel="stylesheet" th:href="@{/styles.css}">
    <link rel="stylesheet" th:href="@{/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/messaging.css}">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container">
    <h1>Log an eco-action</h1>
    <h5>What have you done today to save CO2? Write it down below!</h5>

    <form th:action="@{/actions/log}" th:object="${sustainabilityActionDto}" method="post">

        <div class="input-group">
            <label for="title">Title</label>
            <input type="text" id="title" th:field="*{title}" placeholder="Action title" required />
        </div>

        <div class="input-group">
            <label for="description">Description</label>
            <textarea id="description" th:field="*{description}" placeholder="Describe your action"></textarea>
        </div>

        <div class="input-group">
            <label for="category">Pick category</label>
            <select id="category" th:field="*{category}">
                <option th:each="cat : ${categories}"
                        th:value="${cat}"
                        th:text="${cat}">Category</option>
            </select>
        </div>

        <button type="submit" class="login-btn">Save action</button>
    </form>
    <div style="margin-top: 20px; text-align: center;">
        <a th:href="@{/}" style="color: #666; text-decoration: none; font-size: 14px;">Back to Home</a>
    </div>
</div>

</body>
</html>
