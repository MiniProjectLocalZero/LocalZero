<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start a new Initiative - LocalZero</title>
    <link rel="stylesheet" th:href="@{/styles.css}">
    <link rel="stylesheet" th:href="@{/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/messaging.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="initiative-form-container">
    <h1>Start a new Initiative</h1>
    <p class="description-text">Fill in the details below to create a new initiative for your community and start making an impact.</p>

    <div th:if="${param.error}" class="error-container">
        <p th:text="${param.error}">An error occurred while creating the initiative.</p>
    </div>

    <form th:action="@{/initiatives/create}" th:object="${initiativeDto}" method="post">
        <div class="form-group">
            <label for="title">Initiative Title</label>
            <input type="text" id="title" th:field="*{title}" placeholder="e.g., Neighborhood Composting" required>
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" th:field="*{description}" placeholder="Describe the goals and how people can get involved..."
                      required></textarea>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" th:field="*{category}">
                    <option th:each="cat : ${T(se.mau.localzero.domain.Category).values()}"
                            th:value="${cat}" th:text="${cat}"></option>
                </select>
            </div>

            <div class="form-group">
                <label for="visibility">Visibility</label>
                <select id="visibility" th:field="*{visibility}" required>
                    <option th:each="vis : ${T(se.mau.localzero.domain.Visibility).values()}"
                            th:value="${vis}" th:text="${vis}"></option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="startDate">Start Date</label>
                <input type="date" id="startDate" th:field="*{startDate}" required>
            </div>
            <div class="form-group">
                <label for="endDate">End Date</label>
                <input type="date" id="endDate" th:field="*{endDate}" required>
            </div>
        </div>

        <button type="submit" class="btn-submit">Create Initiative</button>
    </form>
    
    <a th:href="@{/initiatives}" class="footer-link">← Back to Initiatives</a>
</div>

</body>
</html>
