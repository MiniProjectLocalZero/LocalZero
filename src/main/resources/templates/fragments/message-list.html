<div th:fragment="content" class="conversation-list-shell" th:attr="data-unread-count=${unreadCount}">
    <div class="messaging-sidebar-header">
        <div class="sidebar-header-info">
            <h4 class="sidebar-header-title">Messages</h4>
            <span class="sidebar-header-subtitle" th:text="${unreadCount > 0 ? unreadCount + ' unread' : 'All caught up'}">All caught up</span>
        </div>
        <div class="sidebar-header-actions">
            <button type="button" class="new-conversation-btn" onclick="openUserPicker()" title="Start new conversation">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
            </button>
        </div>
    </div>

    <div class="conversation-list" id="conversation-list">
        <div role="button"
             tabindex="0"
             class="conversation-item"
             th:each="convo : ${conversations}"
             th:with="otherUser=${convo.sender.id == currentUser.id ? convo.receiver : convo.sender}"
             th:attr="data-user-id=${otherUser.id}"
             th:onclick="|loadConversation(${otherUser.id})|"
             th:onkeydown="|handleConversationKeydown(event, ${otherUser.id})|"
             th:classappend="${activeConversationUserId != null and otherUser.id == activeConversationUserId} ? ' is-active' : ''">
            <div class="conversation-avatar">
                <span th:text="${#strings.substring(otherUser.username, 0, 1).toUpperCase()}">U</span>
            </div>

            <div class="conversation-details">
                <div class="conversation-topline">
                    <h4 th:text="${otherUser.username}">Username</h4>
                    <span class="conversation-time" th:text="${#temporals.format(convo.createdAt, 'HH:mm')}">12:30</span>
                </div>
                <p th:text="${convo.content}">Last message...</p>
            </div>

            <div class="conversation-status-area">
                <!-- If unread: show the dot -->
                <span class="conversation-unread-dot" th:if="${convo.readAt == null and convo.receiver.id == currentUser.id}"></span>
                
                <!-- If read: show the mark as unread button (hover state handled in CSS) -->
                <button type="button" 
                        class="mark-unread-btn" 
                        th:if="${convo.readAt != null and convo.receiver.id == currentUser.id}"
                        th:onclick="|markAsUnread(event, ${convo.id})|"
                        title="Mark as unread">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                    </svg>
                </button>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(conversations)}" class="empty-conversations">
            <p class="empty-title">No messages yet</p>
            <p>When someone writes to you, the conversation will appear here.</p>
        </div>
    </div>

    <div id="userPickerModal" class="user-picker-modal" style="display: none;">
        <div class="user-picker-content">
            <div class="user-picker-header">
                <h4>Start a conversation</h4>
                <button class="user-picker-close" onclick="closeUserPicker()" type="button">&times;</button>
            </div>
            <div class="user-picker-search">
                <input type="text" id="userSearchInput" placeholder="Search community members..." onkeyup="filterUsers(this.value)">
            </div>
            <div id="userPickerList" class="user-picker-list"></div>
        </div>
    </div>
</div>
