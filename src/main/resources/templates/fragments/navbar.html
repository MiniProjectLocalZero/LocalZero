<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>LocalZero - Navbar</title>
    <link rel="stylesheet" th:href="@{/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/messaging.css}">

    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>
<nav th:fragment="navbar" class="nav-container" sec:authorize="isAuthenticated()">
    <div class="nav-brand">
        <a th:href="@{/}" class="brand-logo">LocalZero</a>
        <button class="mobile-toggle" onclick="toggleMobileMenu()" aria-label="Toggle navigation">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </button>
    </div>

    <div class="nav-content" id="navContent">
        <!-- Center Section: Primary Navigation (Always visible or in hamburger) -->
        <div class="nav-links">
            <a th:href="@{/}" class="nav-link">
                <i class="fas fa-home"></i> <span>Home</span>
            </a>
            <a th:href="@{/initiatives}" class="nav-link">
                <i class="fas fa-bullhorn"></i> <span>Initiatives</span>
            </a>
        </div>

        <!-- Right Section: User Actions & Auth -->
        <div class="nav-actions" sec:authorize="isAuthenticated()">
            <div class="user-greeting">
                Logged in as: <strong sec:authentication="name">User</strong>
            </div>

            <div class="action-icons">
                <button type="button" class="icon-btn messaging-trigger" onclick="openMessagingModal()" title="Messages">
                    <span id="message-badge" class="badge message-badge" style="display: none;">0</span>
                    <i class="fas fa-comment-dots"></i>
                </button>

                <div class="notification-wrapper">
                    <button class="icon-btn" id="bell-icon" title="Notifications">
                        <i class="fas fa-bell"></i>
                        <span id="unread-badge" class="badge" th:if="${unreadCount != null and unreadCount > 0}" th:text="${unreadCount}"></span>
                    </button>
                    
                    <div id="notification-dropdown" class="notification-dropdown hidden">
                        <div class="dropdown-header">
                            <h4>Notifications</h4>
                            <a href="#" id="mark-all-read">Mark all as read</a>
                        </div>
                        <div class="dropdown-body">
                            <div th:each="notif : ${recentNotifications}" class="notification-item" th:classappend="${!notif.read} ? 'unread' : ''">
                                <p th:text="${notif.message}"></p>
                                <span class="time" th:text="${#temporals.format(notif.createdAt, 'dd MMM HH:mm')}"></span>
                            </div>
                            <div th:if="${#lists.isEmpty(recentNotifications)}" class="notification-item">
                                <p>No new notifications.</p>
                            </div>
                        </div>
                    </div>
                </div>

                <a th:href="@{/profile}" class="icon-btn" title="My Profile">
                    <i class="fas fa-user-circle"></i>
                </a>
            </div>

            <form th:action="@{/logout}" method="post" class="logout-form">
                <button type="submit" class="logout-btn">Log out</button>
            </form>
        </div>
    </div>

    <div id="messagingModal" class="messaging-modal-overlay" aria-hidden="true">
        <div id="messagingContent" class="messaging-modal-content"></div>
    </div>

    <script th:src="@{/js/notification.js}" defer></script>
    <script th:src="@{/js/messaging.js}" defer></script>
    <script>
        function toggleMobileMenu() {
            const navContent = document.getElementById('navContent');
            navContent.classList.toggle('active');
            const toggle = document.querySelector('.mobile-toggle');
            toggle.classList.toggle('active');
        }
    </script>
</nav>

</body>
</html>
