<div th:fragment="content" class="messaging-shell" th:attr="data-unread-count=${unreadCount}">
    <button th:if="${param.fragment != null}" class="modal-close-btn" type="button" onclick="closeMessagingModal()" aria-label="Close messages">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
    </button>
    <div class="messaging-shell-body">
        <aside class="messaging-sidebar" id="messaging-conversation-list" th:insert="~{fragments/message-list :: content}"></aside>

        <section class="messaging-chat-area" id="messaging-chat-area">
            <div class="messaging-empty-state">
                <div class="messaging-empty-card">
                    <p class="messaging-empty-title">Select a conversation</p>
                    <p>Pick a person from the left to read and reply without leaving the page.</p>
                </div>
            </div>
        </section>
    </div>
</div>
